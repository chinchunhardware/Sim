<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Chua Kok Sim | Chin Chun Hardware</title>

    <meta name="description"
          content="Chua Kok Sim | Chin Chun Hardware">

    <meta name="theme-color"
          content="#07182F">

    <meta name="apple-mobile-web-app-capable"
          content="yes">

    <meta name="apple-mobile-web-app-status-bar-style"
          content="black-translucent">

    <meta name="apple-mobile-web-app-title"
          content="Chin Chun">


    <!-- ==========================================
         FAVICON
    =========================================== -->

    <link rel="icon"
          href="favicon.ico"
          sizes="any">

    <link rel="icon"
          type="image/png"
          href="logo.png">

    <link rel="apple-touch-icon"
          href="apple-touch-icon.png">


    <!-- ==========================================
         PWA
    =========================================== -->

    <link rel="manifest"
          href="manifest.json">


    <!-- ==========================================
         OPEN GRAPH
         IMPORTANT:
         NO OG DESCRIPTION
    =========================================== -->

    <meta property="og:type"
          content="website">

    <meta property="og:title"
          content="Chua Kok Sim | Chin Chun Hardware">

    <meta property="og:url"
          content="https://chinchunhardware.github.io/Sim/">

    <meta property="og:image"
          content="https://chinchunhardware.github.io/Sim/preview.jpg">

    <meta property="og:image:width"
          content="1200">

    <meta property="og:image:height"
          content="630">

    <meta property="og:site_name"
          content="Chin Chun Hardware">


    <!-- ==========================================
         TWITTER / X
    =========================================== -->

    <meta name="twitter:card"
          content="summary_large_image">

    <meta name="twitter:title"
          content="Chua Kok Sim | Chin Chun Hardware">

    <meta name="twitter:image"
          content="https://chinchunhardware.github.io/Sim/preview.jpg">


    <!-- ==========================================
         FONT
    =========================================== -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">


    <!-- ==========================================
         FONT AWESOME
    =========================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


    <!-- ==========================================
         CSS
    =========================================== -->

    <link rel="stylesheet"
          href="style.css">

</head>


<body>


    <!-- ==========================================
         BACKGROUND
    =========================================== -->

    <div class="bg">

        <div class="blue"></div>

        <div class="red"></div>

        <div class="gold"></div>

    </div>


    <!-- ==========================================
         BUSINESS CARD
    =========================================== -->

    <div class="card">


        <!-- ======================================
             COMPANY LOGO
        ======================================= -->

        <img
            src="logo.png"
            class="logo"
            alt="Chin Chun Hardware">


        <!-- ======================================
             PROFILE PHOTO
        ======================================= -->

        <div class="profile-wrapper">

            <div class="profile-ring"></div>

            <img
                src="profile.jpg"
                class="profile"
                alt="Chua Kok Sim">

        </div>


        <!-- ======================================
             NAME
        ======================================= -->

        <h1>
            Chua Kok Sim
        </h1>


        <!-- ======================================
             COMPANY
        ======================================= -->

        <p class="company">
            Chin Chun Hardware
        </p>


        <!-- ======================================
             SAVE CONTACT
        ======================================= -->

        <a
            href="#"
            id="saveContact"
            class="save">

            <i class="fa-solid fa-address-card"></i>

            <span>
                Save Contact
            </span>

        </a>


        <!-- ======================================
             CONTACT BUTTONS
        ======================================= -->

        <div class="row">


            <!-- CALL -->

            <a
                href="tel:+60126763999"
                class="btn">

                <i class="fa-solid fa-phone"></i>

                <span>
                    Call
                </span>

            </a>


            <!-- WHATSAPP -->

            <a
                href="https://wa.me/60126763999"
                target="_blank"
                rel="noopener noreferrer"
                class="btn">

                <i class="fa-brands fa-whatsapp"></i>

                <span>
                    WhatsApp
                </span>

            </a>


            <!-- EMAIL -->

            <a
                href="mailto:cc_hardware@hotmail.com"
                class="btn">

                <i class="fa-solid fa-envelope"></i>

                <span>
                    Email
                </span>

            </a>

        </div>


        <!-- ======================================
             LOCATION BUTTONS
        ======================================= -->

        <div class="row">


            <!-- HQ -->

            <a
                href="https://waze.com/ul/hw281yqbqy"
                target="_blank"
                rel="noopener noreferrer"
                class="btn">

                <i class="fa-solid fa-building"></i>

                <span>
                    HQ
                </span>

            </a>


            <!-- HOMEMART -->

            <a
                href="https://waze.com/ul/hw281vnm91"
                target="_blank"
                rel="noopener noreferrer"
                class="btn">

                <i class="fa-solid fa-house"></i>

                <span>
                    HomeMart
                </span>

            </a>


            <!-- CHIN CHUN 2 -->

            <a
                href="https://waze.com/ul/hw284kmwgm"
                target="_blank"
                rel="noopener noreferrer"
                class="btn">

                <i class="fa-solid fa-warehouse"></i>

                <span>
                    Branch 2
                </span>

            </a>

        </div>


        <!-- ======================================
             WEBSITE
        ======================================= -->

        <a
            href="https://www.chinchunhardware.my"
            target="_blank"
            rel="noopener noreferrer"
            class="website">

            <i class="fa-solid fa-globe"></i>

            <span>
                Visit Website
            </span>

        </a>


        <!-- ======================================
             SHARE CONTACT
        ======================================= -->

        <button
            type="button"
            id="shareButton"
            class="share">

            <i class="fa-solid fa-share-nodes"></i>

            <span>
                Share Contact
            </span>

        </button>


    </div>


    <!-- ==========================================
         JAVASCRIPT
    =========================================== -->

    <script src="script.js"></script>


</body>

</html>
